; Kombi uzaktan kontrol — ESP32 cihaz yazilimi
; Plan: ai sirket/shared/memory/plan/kombi-kontrol.md
;
; Iki ortam var:
;   esp32dev      -> GELISTIRME yazilimi (benzetim komutlarina IZIN VERIR)
;   esp32dev_prod -> KALICI MONTAJ yazilimi (benzetim komutlari derlenmez)
;   native        -> karar cekirdeginin makinede kosan birim testleri (`pio test -e native`)
; Cekirdek (lib/kombi_core) platformdan bagimsiz oldugu icin karta hic dokunmadan
; histerezis / donma korumasi / sensor arizasi / saatli kural mantigi olculebiliyor.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Eldeki kart: orijinal ESP32, CH340 koprusu, flash mode DIO (olculdu 14.10.2026).
board_build.flash_mode = dio
lib_deps =
	adafruit/DHT sensor library@1.4.6
	adafruit/Adafruit Unified Sensor@1.1.14
	bblanchon/ArduinoJson@7.1.0
build_flags =
	-DCORE_DEBUG_LEVEL=1
	; Benzetim komutlarinin derlenmesine YALNIZ bu ortamda izin var (YUKSEK-1).
	; main.cpp'deki #error kapisi bu tanim olmadan KOMBI_ALLOW_SIM=1'i reddeder.
	-DKOMBI_DEV_BUILD=1
; Birim testleri bu ortamda kosmaz (karta flash gerektirirdi).
test_ignore = *

; KALICI MONTAJ ORTAMI — kombiye baglanacak kart bununla derlenir.
; `sim temp/fault/time`, `wifi on|off`, `wdtest` komutlari DERLENMEZ; USB'si
; eline gecen biri roleyi suremez. Olcum: `info` ciktisinda SIM=0.
[env:esp32dev_prod]
extends = env:esp32dev
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DKOMBI_ALLOW_SIM=0

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-Wall
