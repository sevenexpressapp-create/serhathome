; Pin tespit araci — AYRI bir PlatformIO projesi (kendi main'i var, ana yazilimla
; cakismasin). Amaci: eski firmware'in kaynagi elde olmadigi icin DHT11 ve role
; pinlerini OLCEREK bulmak.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
lib_deps =
	adafruit/DHT sensor library@1.4.6
	adafruit/Adafruit Unified Sensor@1.1.14
